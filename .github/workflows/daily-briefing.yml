name: Daily News Briefing

on:
  schedule:
    # 18:30 UTC = 6:30am NZST (winter) / 7:30am NZDT (summer).
    # Cron doesn't shift for daylight saving, so delivery drifts ~1hr across the year.
    - cron: "30 18 * * *"
  workflow_dispatch:
    # Allows manual "Run workflow" triggering from the Actions tab.

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          # Read the username from a Secret or a Variable (whichever is set) —
          # a username is commonly added under the Variables tab by mistake.
          ENERGYNEWS_USERNAME: ${{ secrets.ENERGYNEWS_USERNAME || vars.ENERGYNEWS_USERNAME }}
          ENERGYNEWS_PASSWORD: ${{ secrets.ENERGYNEWS_PASSWORD }}
        run: python main.py
